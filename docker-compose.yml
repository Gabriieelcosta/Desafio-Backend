services:

  # ─── PostgreSQL ────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: solicitations-postgres
    environment:
      POSTGRES_DB: solicitations
      POSTGRES_USER: solicitations
      POSTGRES_PASSWORD: solicitations
    ports:
      - "5432:5432"             # porta-do-host:porta-do-container
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solicitations"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Elasticsearch ─────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: solicitations-elasticsearch
    environment:
      - discovery.type=single-node          # modo single-node (desenvolvimento)
      - xpack.security.enabled=false        # sem SSL/auth no dev
      - ES_JAVA_OPTS=-Xms512m -Xmx512m      # limita memória RAM usada
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ─── Aplicação Spring Boot ──────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: solicitations-app
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      DB_HOST: postgres           # nome do serviço no docker-compose = hostname
      DB_PORT: 5432
      DB_NAME: solicitations
      DB_USER: solicitations
      DB_PASS: solicitations
      ES_URI: http://elasticsearch:9200
      JWT_SECRET: troque-isso-em-producao-use-uma-chave-longa
    ports:
      - "8080:8080"

volumes:
  postgres_data:
  es_data: