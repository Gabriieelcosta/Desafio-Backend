spring:
  application:
    name: solicitations

  # Qual "perfil" usar por padrão (dev, prod, etc.)
  profiles:
    active: dev

  # Configuração do banco de dados (PostgreSQL)
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:solicitations}
    username: ${DB_USER:solicitations}
    password: ${DB_PASS:solicitations}
    driver-class-name: org.postgresql.Driver

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # Flyway (migrations do banco)
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Elasticsearch
  elasticsearch:
    uris: ${ES_URI:http://localhost:9200}

# Configurações JWT
app:
  jwt:
    secret: ${JWT_SECRET:minha-chave-secreta-super-longa-para-dev-trocar-em-prod}
    expiration-ms: 86400000

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

# Logs
logging:
  level:
    root: INFO
    com.solicitations: DEBUG
    org.springframework.security: INFO